[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kurversc"
version = "0.2.0"
description = "Validation-guided configuration search for GraphReduce"
authors = [{ name = "KurveAI" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "catboost>=1.2,<2",
    "duckdb>=1.2,<1.3",
    "graphreduce>=1.10.18,<1.11",
    "numpy>=1.24,<2",
    "pandas>=1.5,<3.1",
    "pytz>=2024.1",
    "scikit-learn>=1.4,<2",
    "structlog>=23.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
relbench = ["relbench>=2.1,<3"]
tabicl = ["tabicl>=2.1,<3"]
tabpfn = ["tabpfn>=8.5,<10"]
tabfm = ["tabfm>=0.1,<1"]
staged = [
    "graphreduce==1.10.18",
    "catboost==1.2.10",
    "duckdb==1.2.2",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scikit-learn==1.6.1",
    "relbench==2.1.2",
    "psutil>=5.9,<8",
    "pyarrow==20.0.0",
]

[project.urls]
Homepage = "https://kurve.ai/research"
Blog = "https://kurve.ai/blog/kurversc-learning-the-shape-of-relational-signal"
Repository = "https://github.com/kurveai/kurversc"
Documentation = "https://github.com/kurveai/kurversc/blob/main/docs/kurversc-staged-technical-report.md"
Issues = "https://github.com/kurveai/kurversc/issues"

[project.scripts]
kurveplanner-train = "kurversc.planner_training:main"
kurversc-staged = "kurversc.staged:main"

[tool.setuptools.packages.find]
include = ["kurversc*"]

[tool.setuptools.cmdclass]
build_py = "staged_build.BoundedStagedBuild"

[tool.pytest.ini_options]
testpaths = ["tests"]
