<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Kurve RSC validation-guided relational configuration optimization</title>
  <desc id="desc">Relational database and task cutoffs feed a Kurve RSC configuration loop. Candidates with different depth and feature families are executed by GraphReduce, producing frames of different widths. A downstream learner fits each frame, validation performance scores the complete trial, and Kurve RSC selects and rebuilds the winner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="kurve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#5B21B6"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .section { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .label { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .db-label { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .white { fill: #FFFFFF; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748B; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="930" rx="26" fill="url(#bg)"/>
  <text x="70" y="67" class="title">Kurve RSC learns the relational representation with the predictor in the loop</text>
  <text x="70" y="99" class="subtitle">One validation objective evaluates both the generated frame and the downstream model fitted on it.</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="70" y="155" width="235" height="190" rx="18" class="card"/>
  </g>
  <circle cx="112" cy="201" r="22" fill="#DBEAFE"/>
  <path d="M98 193h28M98 201h28M98 209h28" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="207" class="db-label">Relational database</text>
  <text x="98" y="250" class="small">tables · keys · timestamps</text>
  <text x="98" y="277" class="small">one-to-many histories</text>
  <rect x="98" y="302" width="176" height="25" rx="8" fill="#EFF6FF"/>
  <text x="112" y="319" class="tiny">visible history at cutoff c</text>

  <g filter="url(#shadow)">
    <rect x="70" y="380" width="235" height="150" rx="18" class="card"/>
  </g>
  <circle cx="112" cy="426" r="22" fill="#FEF3C7"/>
  <path d="M103 427l7 7 13-17" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="432" class="label">Task contract</text>
  <text x="98" y="473" class="small">entity rows · labels · splits</text>
  <text x="98" y="500" class="small">validation metric</text>

  <!-- Kurve configuration proposer -->
  <g filter="url(#shadow)">
    <rect x="375" y="145" width="325" height="400" rx="22" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
  </g>
  <rect x="375" y="145" width="325" height="65" rx="22" fill="url(#kurve)"/>
  <rect x="375" y="187" width="325" height="23" fill="url(#kurve)"/>
  <text x="405" y="185" class="label white">Kurve RSC candidate space</text>
  <text x="405" y="242" class="small">Depth</text>
  <g>
    <rect x="405" y="258" width="57" height="35" rx="9" fill="#EDE9FE"/><text x="428" y="281" class="label" text-anchor="middle">1</text>
    <rect x="472" y="258" width="57" height="35" rx="9" fill="#DDD6FE"/><text x="500" y="281" class="label" text-anchor="middle">2</text>
    <rect x="539" y="258" width="57" height="35" rx="9" fill="#C4B5FD"/><text x="567" y="281" class="label" text-anchor="middle">3</text>
  </g>
  <text x="405" y="329" class="small">Cumulative feature families</text>
  <rect x="405" y="345" width="93" height="32" rx="9" fill="#F1F5F9"/><text x="452" y="366" class="tiny" text-anchor="middle">base</text>
  <rect x="405" y="385" width="170" height="32" rx="9" fill="#E0E7FF"/><text x="490" y="406" class="tiny" text-anchor="middle">base + temporal</text>
  <rect x="405" y="425" width="250" height="32" rx="9" fill="#DDD6FE"/><text x="530" y="446" class="tiny" text-anchor="middle">base + temporal + conditional</text>
  <text x="405" y="489" class="small">Annotations: on / off</text>
  <text x="405" y="517" class="small">Budgets: bounded / uncapped</text>

  <!-- GraphReduce execution -->
  <path d="M305 250 C337 250 342 250 370 250" class="arrow"/>
  <path d="M305 455 C340 455 338 455 370 455" class="arrow"/>
  <path d="M700 345 C738 345 740 345 775 345" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="780" y="145" width="315" height="400" rx="22" class="card"/>
  </g>
  <rect x="780" y="145" width="315" height="65" rx="22" fill="#1E293B"/>
  <rect x="780" y="187" width="315" height="23" fill="#1E293B"/>
  <text x="810" y="185" class="label white">GraphReduce execution</text>
  <text x="810" y="240" class="small">Instantiate one fresh compute graph</text>
  <text x="810" y="268" class="small">for candidate q and cutoff c</text>

  <!-- miniature graph -->
  <line x1="848" y1="337" x2="931" y2="308" stroke="#94A3B8" stroke-width="3"/>
  <line x1="848" y1="337" x2="931" y2="381" stroke="#94A3B8" stroke-width="3"/>
  <line x1="931" y1="308" x2="1019" y2="272" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="931" y1="381" x2="1019" y2="421" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="848" cy="337" r="28" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2"/>
  <circle cx="931" cy="308" r="23" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="931" cy="381" r="23" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="1019" cy="272" r="19" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <circle cx="1019" cy="421" r="19" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="848" y="342" class="tiny" text-anchor="middle">root</text>
  <text x="931" y="313" class="tiny" text-anchor="middle">hop 1</text>
  <text x="931" y="386" class="tiny" text-anchor="middle">hop 1</text>
  <text x="1019" y="277" class="tiny" text-anchor="middle">2+</text>
  <text x="1019" y="426" class="tiny" text-anchor="middle">2+</text>
  <text x="810" y="486" class="small">filter → annotate → reduce → join</text>
  <text x="810" y="516" class="tiny">GraphReduce executes; Kurve RSC directs the trial.</text>

  <!-- Differently shaped frames -->
  <path d="M1095 345 C1128 345 1132 345 1165 345" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1170" y="145" width="360" height="400" rx="22" class="card"/>
  </g>
  <text x="1200" y="185" class="section">Candidate-shaped frames</text>
  <text x="1200" y="214" class="tiny">same prediction grain; different width and lineage</text>

  <!-- narrow frame -->
  <text x="1200" y="258" class="tiny">q₁: depth 1 · base</text>
  <rect x="1200" y="271" width="150" height="64" rx="7" fill="#EFF6FF" stroke="#60A5FA"/>
  <path d="M1230 271v64M1260 271v64M1290 271v64M1320 271v64M1200 292h150M1200 313h150" stroke="#93C5FD"/>
  <text x="1370" y="309" class="tiny">n₁ × p₁</text>

  <!-- medium frame -->
  <text x="1200" y="373" class="tiny">q₂: depth 2 · base + temporal</text>
  <rect x="1200" y="386" width="220" height="64" rx="7" fill="#EEF2FF" stroke="#818CF8"/>
  <path d="M1230 386v64M1260 386v64M1290 386v64M1320 386v64M1350 386v64M1380 386v64M1200 407h220M1200 428h220" stroke="#A5B4FC"/>
  <text x="1440" y="424" class="tiny">n₂ × p₂</text>

  <!-- wide frame -->
  <text x="1200" y="488" class="tiny">q₃: depth 3 · + conditional</text>
  <rect x="1200" y="501" width="292" height="28" rx="7" fill="#F3E8FF" stroke="#A78BFA"/>
  <path d="M1230 501v28M1260 501v28M1290 501v28M1320 501v28M1350 501v28M1380 501v28M1410 501v28M1440 501v28M1470 501v28" stroke="#C4B5FD"/>

  <!-- Lower learning/evaluation loop -->
  <path d="M1350 545 L1350 610" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1040" y="615" width="490" height="150" rx="22" fill="url(#model)"/>
  </g>
  <text x="1075" y="660" class="label white">Fit downstream learner Mq</text>
  <text x="1075" y="695" class="small white">CatBoost today · TabPFN and other adapters next</text>
  <rect x="1075" y="718" width="405" height="27" rx="9" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="1090" y="737" class="tiny white">The learner evaluates the usefulness of the generated representation.</text>

  <path d="M1040 690 C982 690 972 690 916 690" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="670" y="615" width="275" height="150" rx="22" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <text x="700" y="660" class="label">Validation objective J(q)</text>
  <text x="700" y="697" class="small">maximize AUROC</text>
  <text x="700" y="725" class="small">or minimize MAE</text>

  <!-- Feedback -->
  <path d="M670 690 C560 690 525 655 525 578 L525 553" fill="none" stroke="#5B21B6" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <rect x="432" y="615" width="155" height="31" rx="10" fill="#EDE9FE"/>
  <text x="509" y="636" class="tiny" text-anchor="middle">score closes the loop</text>

  <!-- Winner -->
  <path d="M807 765 L807 815" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="445" y="820" width="725" height="72" rx="18" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  </g>
  <circle cx="486" cy="856" r="20" fill="#DCFCE7"/>
  <path d="M477 856l6 6 12-15" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="849" class="label">Select q* → rebuild on full data → freeze plan + schema → refit production model</text>
  <text x="520" y="875" class="tiny">Multiple cutoff frames can now increase training height while the winning relational program remains fixed.</text>

</svg>
