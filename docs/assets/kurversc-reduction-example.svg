<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
<title id="title">Worked keyed-reduction example</title><desc id="desc">Customer A has orders O1 and O2, with totals 20 and 100. Lines priced 10, 10 and 100 reduce to per-order maxima and means 10 and 100. Those summaries join to orders before reduction to customer grain. The selected output is customer A, order count 2, total sum 120, total mean 60, line maximum 100 and mean of order-level means 55.</desc>
