[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kurversc"
version = "0.1.0"
description = "Validation-guided configuration search for GraphReduce"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "catboost>=1.2,<2",
    "duckdb>=1.2,<1.3",
    "graphreduce==1.10.3",
    "numpy>=1.24,<2",
    "pandas>=1.5,<3.1",
    "pytz>=2024.1",
    "scikit-learn>=1.4,<2",
    "structlog>=23.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
relbench = ["relbench>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["kurversc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
