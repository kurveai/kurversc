<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GraphReduce depth-first relational reduction under point-in-time cutoffs</title>
  <desc id="desc">A root entity table is connected to one-to-many child event tables and deeper descendants. A cutoff clock is propagated down the graph. Deep children are filtered, annotated, grouped by foreign key, and reduced before their features are joined upward. The final table preserves one row per root entity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="up" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0F766E"/>
    </marker>
    <marker id="time" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#D97706"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0F172A; }
      .sub { font: 600 18px Arial, Helvetica, sans-serif; fill: #334155; }
      .section { font: 700 20px Arial, Helvetica, sans-serif; fill: #0F172A; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #0F172A; }
      .small { font: 600 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 700 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .white { fill: #FFFFFF; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="26" fill="url(#bg)"/>
  <text x="65" y="62" class="title">GraphReduce compiles many relational grains into one root grain</text>
  <text x="65" y="96" class="sub">Point-in-time filtering travels down the graph; aggregated signal travels back up.</text>

  <!-- cutoff rail -->
  <g filter="url(#shadow)"><rect x="65" y="145" width="250" height="630" rx="22" class="card"/></g>
  <text x="95" y="185" class="section">Temporal contract</text>
  <circle cx="135" cy="246" r="29" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="135" cy="246" r="17" fill="none" stroke="#D97706" stroke-width="3"/>
  <path d="M135 246v-10M135 246l9 7" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="240" class="label">Entity cutoff c</text>
  <text x="180" y="263" class="tiny">official task timestamp</text>
  <line x1="135" y1="290" x2="135" y2="680" stroke="#D97706" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#time)"/>
  <rect x="95" y="335" width="190" height="75" rx="10" fill="#FFFBEB"/>
  <text x="110" y="360" class="tiny">ROOT INVARIANT</text>
  <text x="110" y="384" class="small">root.date ≤ c</text>
  <text x="110" y="402" class="tiny">pushed into load + filter</text>
  <rect x="95" y="455" width="190" height="90" rx="10" fill="#FFFBEB"/>
  <text x="110" y="480" class="tiny">HISTORY WINDOW</text>
  <text x="110" y="504" class="small">c − H &lt; event ≤ c</text>
  <text x="110" y="526" class="tiny">per entity / relationship</text>
  <rect x="95" y="590" width="190" height="105" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="110" y="615" class="tiny">NO TEST DISCOVERY</text>
  <text x="110" y="640" class="small">frozen operations</text>
  <text x="110" y="663" class="small">rebound time literals</text>
  <text x="110" y="686" class="small">train=False</text>

  <!-- graph -->
  <g filter="url(#shadow)"><rect x="360" y="145" width="760" height="630" rx="22" class="card"/></g>
  <text x="390" y="185" class="section">Depth-first graph execution</text>
  <text x="390" y="214" class="small">reduce deepest descendants before joining their parents</text>

  <!-- Edges, upward direction -->
  <path d="M780 650 C735 610 690 575 640 578" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" marker-end="url(#up)"/>
  <path d="M955 650 C930 615 915 590 900 578" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" marker-end="url(#up)"/>
  <path d="M640 490 C615 465 590 448 560 438" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" marker-end="url(#up)"/>
  <path d="M900 490 C875 465 845 448 815 438" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" marker-end="url(#up)"/>
  <path d="M560 350 C600 332 640 325 675 318" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" marker-end="url(#up)"/>
  <path d="M815 350 C810 335 800 325 790 318" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" marker-end="url(#up)"/>

  <!-- root -->
  <rect x="635" y="240" width="220" height="78" rx="18" fill="url(#root)"/>
  <text x="745" y="272" class="label white" text-anchor="middle">ROOT ENTITY</text>
  <text x="745" y="297" class="small white" text-anchor="middle">one row per prediction key</text>

  <!-- depth 1 -->
  <rect x="445" y="350" width="230" height="88" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="560" y="382" class="label" text-anchor="middle">Child table A</text>
  <text x="560" y="406" class="tiny" text-anchor="middle">many rows → GROUP BY root_fk</text>
  <text x="560" y="425" class="tiny" text-anchor="middle">depth 1</text>

  <rect x="700" y="350" width="230" height="88" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="815" y="382" class="label" text-anchor="middle">Child table B</text>
  <text x="815" y="406" class="tiny" text-anchor="middle">many rows → GROUP BY root_fk</text>
  <text x="815" y="425" class="tiny" text-anchor="middle">depth 1</text>

  <!-- depth 2 -->
  <rect x="520" y="490" width="240" height="88" rx="16" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
  <text x="640" y="522" class="label" text-anchor="middle">Grandchild events</text>
  <text x="640" y="546" class="tiny" text-anchor="middle">annotate → filter → reduce</text>
  <text x="640" y="565" class="tiny" text-anchor="middle">depth 2</text>

  <rect x="780" y="490" width="240" height="88" rx="16" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
  <text x="900" y="522" class="label" text-anchor="middle">Grandchild history</text>
  <text x="900" y="546" class="tiny" text-anchor="middle">annotate → filter → reduce</text>
  <text x="900" y="565" class="tiny" text-anchor="middle">depth 2</text>

  <!-- depth 3 -->
  <rect x="685" y="650" width="190" height="70" rx="15" fill="#F3E8FF" stroke="#A78BFA" stroke-width="2"/>
  <text x="780" y="680" class="label" text-anchor="middle">Deep table</text>
  <text x="780" y="703" class="tiny" text-anchor="middle">depth 3</text>
  <rect x="885" y="650" width="190" height="70" rx="15" fill="#F3E8FF" stroke="#A78BFA" stroke-width="2"/>
  <text x="980" y="680" class="label" text-anchor="middle">Deep table</text>
  <text x="980" y="703" class="tiny" text-anchor="middle">depth 3</text>

  <rect x="390" y="612" width="240" height="104" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="410" y="638" class="tiny">UPWARD SIGNAL</text>
  <text x="410" y="662" class="small">counts · recency · windows</text>
  <text x="410" y="685" class="small">conditions · sequences</text>
  <text x="410" y="708" class="small">episodes · semantic context</text>

  <!-- compiled frame -->
  <g filter="url(#shadow)"><rect x="1165" y="145" width="370" height="630" rx="22" class="card"/></g>
  <text x="1195" y="185" class="section">Compiled root frame</text>
  <text x="1195" y="214" class="small">grain is preserved; lineage is prefixed</text>

  <rect x="1195" y="260" width="310" height="210" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <path d="M1245 260v210M1295 260v210M1345 260v210M1395 260v210M1445 260v210M1195 302h310M1195 344h310M1195 386h310M1195 428h310" stroke="#C7D2FE"/>
  <text x="1220" y="286" class="tiny" text-anchor="middle">key</text>
  <text x="1270" y="286" class="tiny" text-anchor="middle">root</text>
  <text x="1320" y="286" class="tiny" text-anchor="middle">A_*</text>
  <text x="1370" y="286" class="tiny" text-anchor="middle">B_*</text>
  <text x="1420" y="286" class="tiny" text-anchor="middle">event_*</text>
  <text x="1475" y="286" class="tiny" text-anchor="middle">deep_*</text>

  <rect x="1195" y="505" width="310" height="82" rx="12" fill="#ECFDF5"/>
  <text x="1215" y="532" class="tiny">INVARIANT</text>
  <text x="1215" y="557" class="label">one model row per root key</text>
  <text x="1215" y="578" class="tiny">unless task labels intentionally repeat cutoffs</text>

  <rect x="1195" y="620" width="310" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1215" y="647" class="tiny">FROZEN PLAN</text>
  <text x="1215" y="672" class="small">SQL operations + reduce keys</text>
  <text x="1215" y="696" class="small">inferred periods + ordered schema</text>

  <path d="M1120 450 H1160" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#up)"/>

  <text x="65" y="835" class="sub">Depth limits which paths may contribute. Feature families determine which statistics survive each many-to-one reduction.</text>
</svg>
