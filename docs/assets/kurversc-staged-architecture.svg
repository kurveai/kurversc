<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
  <title id="title">KurveRSC 0.2.0 architecture</title>
  <desc id="desc">A database and task contract pass through strict temporal filtering. Schema-derived programs are executed by GraphReduce and scored by a pluggable downstream learner in an increasing-fidelity validation loop. CatBoost is the evaluated reference; compatible tabular foundation-model adapters can use the same frame interface. Production-faithful finalist checks and temporal policy selection precede optional candidates evaluated against one incumbent using a shared gate. The selected graph, schema, training policy and fitted learner are frozen for keyed prediction. Outer test targets are used only by an external scorer.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#53667d"/>
    </marker>
    <marker id="feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2b65a4"/>
    </marker>
    <style>
      text {font-family: Arial, Helvetica, sans-serif; fill: #172b42;}
      .heading {font-size: 30px; font-weight: 700;}
      .label {font-size: 27px; font-weight: 700;}
      .body {font-size: 25px;}
      .small {font-size: 23px;}
      .card {fill: #ffffff; stroke: #b9c7d6; stroke-width: 2;}
      .flow {fill: none; stroke: #53667d; stroke-width: 3; marker-end: url(#arrow);}
      .loop {fill: none; stroke: #2b65a4; stroke-width: 3; marker-end: url(#feedback);}
    </style>
  </defs>
  <rect width="1440" height="1200" fill="#ffffff"/>

  <rect x="30" y="20" width="650" height="132" rx="12" class="card"/>
  <text x="54" y="62" class="heading">Relational database</text>
  <text x="54" y="101" class="body">Tables, keys, event and availability clocks</text>
  <text x="54" y="132" class="small">Related records at different granularities</text>
  <rect x="760" y="20" width="650" height="132" rx="12" class="card"/>
  <text x="784" y="62" class="heading">Task contract</text>
  <text x="784" y="101" class="body">Root entity, horizon, origins and metric</text>
  <text x="784" y="132" class="small">Observed labels and masked forecast requests</text>

  <path d="M355 153 V185" class="flow"/>
  <path d="M1085 153 V185" class="flow"/>
  <rect x="30" y="188" width="1380" height="84" rx="10" fill="#edf4fc" stroke="#779ac4" stroke-width="2"/>
  <text x="720" y="222" class="label" text-anchor="middle">Point-in-time boundary: source event time &lt; query cutoff</text>
  <text x="720" y="253" class="small" text-anchor="middle">Phase-censored inputs; mature observed-label history and eligible peer context</text>
  <path d="M720 273 V303" class="flow"/>

  <rect x="30" y="307" width="1380" height="351" rx="12" fill="#f6f9fd" stroke="#779ac4" stroke-width="2"/>
  <text x="55" y="343" class="heading">1. Staged relational search (S1)</text>
  <rect x="55" y="366" width="410" height="188" rx="9" class="card"/>
  <text x="77" y="405" class="label">Schema-derived programs</text>
  <text x="77" y="445" class="small">Depth 1-4; bounded repeated paths</text>
  <text x="77" y="481" class="small">Family combinations; base + CDF</text>
  <text x="77" y="517" class="small">Annotations and payload budgets</text>

  <path d="M466 463 H510" class="flow"/>
  <rect x="515" y="366" width="410" height="188" rx="9" class="card"/>
  <text x="537" y="405" class="label">GraphReduce</text>
  <text x="537" y="441" class="small">Filter, annotate, reduce and join</text>
  <path d="M565 493 L625 472 M565 493 L625 514 M625 472 L682 493 M625 514 L682 493" fill="none" stroke="#779ac4" stroke-width="3"/>
  <circle cx="565" cy="493" r="15" fill="#2b65a4"/>
  <circle cx="625" cy="472" r="12" fill="#b9d3ee" stroke="#779ac4" stroke-width="2"/>
  <circle cx="625" cy="514" r="12" fill="#b9d3ee" stroke="#779ac4" stroke-width="2"/>
  <circle cx="682" cy="493" r="10" fill="#e1ebf5" stroke="#779ac4" stroke-width="2"/>
  <path d="M707 493 H752" class="flow"/>
  <rect x="766" y="467" width="131" height="56" fill="#edf4fc" stroke="#779ac4" stroke-width="2"/>
  <path d="M792 467 V523 M818 467 V523 M844 467 V523 M870 467 V523 M766 486 H897 M766 505 H897" stroke="#a9c3df" stroke-width="1.5"/>
  <text x="537" y="542" font-size="21">Typed entity-grain feature frame</text>

  <path d="M926 463 H970" class="flow"/>
  <rect x="975" y="366" width="410" height="188" rx="9" fill="#eff8f6" stroke="#78aaa2" stroke-width="2"/>
  <text x="997" y="405" class="label">Pluggable learner</text>
  <text x="997" y="443" class="small">CatBoost: evaluated reference</text>
  <text x="997" y="477" class="small">TFMs via compatible adapters</text>
  <text x="997" y="511" class="small">Validate representation + learner</text>
  <text x="997" y="543" font-size="21">ROC-AUC (higher) / MAE (lower)</text>

  <path d="M1180 555 V580 H260 V556" class="loop"/>
  <rect x="533" y="565" width="374" height="32" rx="8" fill="#f6f9fd"/>
  <text x="720" y="589" class="small" text-anchor="middle" fill="#2b65a4">Validation drives promotion</text>
  <text x="720" y="633" class="label" text-anchor="middle">10K screening  &#8594;  50K confirmation  &#8594;  full-source rerank</text>

  <path d="M355 659 V704" class="flow"/>
  <rect x="30" y="708" width="650" height="130" rx="10" fill="#edf4fc" stroke="#779ac4" stroke-width="2"/>
  <text x="54" y="749" class="label">2. Production-faithful finalist check (S2)</text>
  <text x="54" y="787" class="small">Bounded comparison with a smaller completed graph</text>
  <text x="54" y="819" class="small">Matched fitting lifecycle for classification and regression</text>
  <path d="M681 773 H755" class="flow"/>
  <rect x="760" y="708" width="650" height="130" rx="10" fill="#edf4fc" stroke="#779ac4" stroke-width="2"/>
  <text x="784" y="749" class="label">3. Temporal training policy (S3)</text>
  <text x="784" y="787" class="small">Recent-only / pooled support / temporal blends</text>
  <text x="784" y="819" class="small">Walk-forward origins and matched validation seeds</text>

  <path d="M1085 839 V879" class="flow"/>
  <rect x="30" y="883" width="1380" height="123" rx="10" fill="#eff8f6" stroke="#78aaa2" stroke-width="2"/>
  <text x="54" y="921" class="label">4. Optional candidates evaluated with one shared temporal gate</text>
  <text x="54" y="959" class="body">Text  &#183;  frame ensembles  &#183;  target domain  &#183;  zero-aware  &#183;  object breadth</text>
  <text x="54" y="990" class="small">One incumbent; matched origins and seeds; independent applicability; uncertainty and safety checks</text>

  <path d="M530 1007 V1048" class="flow"/>
  <rect x="30" y="1052" width="1000" height="112" rx="10" fill="#172b42"/>
  <text x="54" y="1089" class="label" style="fill:#ffffff">Freeze and fit</text>
  <text x="54" y="1121" class="small" style="fill:#ffffff">Graph plan + ordered schema + selected training policy + fitted learner</text>
  <text x="54" y="1151" class="small" style="fill:#ffffff">Replay on forecast requests with feature discovery disabled</text>
  <path d="M1031 1108 H1067" class="flow"/>
  <rect x="1072" y="1052" width="338" height="112" rx="10" fill="#eff8f6" stroke="#78aaa2" stroke-width="2"/>
  <text x="1096" y="1091" class="label">Keyed predictions</text>
  <text x="1096" y="1126" class="small">Entity / cutoff order</text>
  <text x="720" y="1192" font-size="22" text-anchor="middle">Outer test targets are scored externally after predictions are saved.</text>
</svg>
