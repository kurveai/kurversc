<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">KurveRSC 0.2.0 architecture</title><desc id="desc">Strict temporal inputs feed bounded, schema-derived relational search. GraphReduce creates a typed entity-level frame for a pluggable learner. Validation promotes candidates from 10K screening to 50K confirmation and full-source rerank. A production-faithful finalist check and temporal policy selection precede one generic optional menu and a shared gate. The selected procedure is frozen and refitted before keyed prediction.</desc>
